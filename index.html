<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jacob Orth — Las Vegas Real Estate</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="Find your dream home in Las Vegas with Jacob Orth. Free consultation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="form-app">
    <div class="step-indicator" id="step-indicator">
      <div class="step-dot active" id="step-form">
        <span class="dot"></span>
        <span class="step-label">Tell us about yourself</span>
      </div>
      <div class="step-dot" id="step-calendar">
        <span class="dot"></span>
        <span class="step-label">Book your call</span>
      </div>
    </div>

    <div class="split-container">
      <div class="form-panel">
        <div class="slides-viewport" id="slides-viewport"></div>
      </div>
      <div class="calendar-panel locked" id="calendar-panel">
        <!-- Decorative calendar graphic behind the lock -->
        <div class="calendar-graphic" id="calendar-graphic" aria-hidden="true">
          <div class="cg-header">
            <span class="cg-month"></span>
            <div class="cg-nav"><span></span><span></span></div>
          </div>
          <div class="cg-dow">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="cg-grid" id="cg-grid"></div>
        </div>

        <div class="calendar-lock-overlay" id="calendar-lock-overlay">
          <div class="lock-content">
            <div class="lock-icon" id="lock-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <p>Fill out the form and we'll<br />unlock the calendar for you.</p>
          </div>
        </div>
        <div class="calendar-focus-header" id="calendar-focus-header">
          <button class="btn-back calendar-focus-back" id="calendar-focus-back" type="button">← Back</button>
          <div class="calendar-focus-copy">
            <h2>Book Your Free Consultation</h2>
            <p>Pick a date and time that works for you</p>
          </div>
        </div>
        <div class="calendar-wrapper" id="calendar-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
